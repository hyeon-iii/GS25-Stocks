<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>편의점 폐기물품 관리</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="container">


<h1>🏪 편의점 폐기물품 관리</h1>



<!-- 상품 추가 -->

<div class="input-box">


<input
type="text"
id="product"
placeholder="제품 이름 입력">



<input
type="datetime-local"
id="expire">



<button onclick="addItem()">
추가
</button>


</div>




<!-- 검색 -->

<input
type="text"
id="search"
placeholder="🔍 제품 검색"
onkeyup="searchItem()">





<div
class="summary"
id="summary">

</div>





<!-- 현재 상품 목록 -->


<h2>
📦 상품 목록
</h2>


<table>


<thead>

<tr>

<th>
제품명
</th>


<th>
유통기한
</th>


<th>
상태
</th>


<th>
삭제
</th>


</tr>


</thead>



<tbody id="list">


</tbody>


</table>






<br>

<hr>

<br>





<!-- 폐기 기록 -->


<h2>
🗑️ 폐기 기록
</h2>



<table>


<thead>

<tr>


<th>
제품명
</th>


<th>
유통기한
</th>


<th>
폐기 시간
</th>


</tr>


</thead>


<tbody id="history">


</tbody>


</table>





<footer>


Firebase 실시간 데이터베이스 기반<br>

모든 직원이 동일한 폐기 목록을 확인할 수 있습니다.


</footer>



</div>





<script type="module" src="script.js"></script>


</body>

</html>
